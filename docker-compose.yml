services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-harness}
      POSTGRES_USER: ${POSTGRES_USER:-harness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harness_dev_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - harness

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - harness

  execution-api:
    build:
      context: ./execution-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://harness:harness_dev_password@postgres:5432/harness?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      EXECUTION_QUEUE: ${EXECUTION_QUEUE:-execution}
      MAINTENANCE_QUEUE: ${MAINTENANCE_QUEUE:-maintenance}
      LEASE_SECONDS: ${LEASE_SECONDS:-60}
      HEARTBEAT_SECONDS: ${HEARTBEAT_SECONDS:-5}
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-30}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-2}
      ARTIFACT_SERVICE_BASE_URL: ${ARTIFACT_SERVICE_BASE_URL:-http://artifact-service:8091}
      ARTIFACT_SERVICE_TIMEOUT_SECONDS: ${ARTIFACT_SERVICE_TIMEOUT_SECONDS:-10}
      CUA_MAX_STEPS: ${CUA_MAX_STEPS:-20}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    ports:
      - "${EXECUTION_API_PORT:-8090}:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      artifact-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/internal/health').read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - harness

  artifact-service:
    build:
      context: ./artifact-service
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://harness:harness_dev_password@postgres:5432/harness?sslmode=disable}
      ARTIFACT_ROOT: ${ARTIFACT_ROOT:-/data/artifacts}
      ARCHIVE_MAX_FILES: ${ARCHIVE_MAX_FILES:-1000}
    volumes:
      - ./data/artifacts:/data/artifacts
    ports:
      - "${ARTIFACT_SERVICE_PORT:-8091}:8091"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/internal/health').read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - harness

  report-service:
    build:
      context: ./report-service
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://harness:harness_dev_password@postgres:5432/harness?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ARTIFACT_SERVICE_BASE_URL: ${ARTIFACT_SERVICE_BASE_URL:-http://artifact-service:8091}
      ARTIFACT_SERVICE_TIMEOUT_SECONDS: ${ARTIFACT_SERVICE_TIMEOUT_SECONDS:-10}
    ports:
      - "${REPORT_SERVICE_PORT:-8092}:8092"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      artifact-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/internal/health').read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - harness

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-postgres://harness:harness_dev_password@postgres:5432/harness?sslmode=disable}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:3001}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-60}
      REFRESH_TOKEN_TTL_HOURS: ${REFRESH_TOKEN_TTL_HOURS:-720}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-test@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Test@$1234}
      DISABLE_AUTH: ${DISABLE_AUTH:-false}
      EXECUTION_API_BASE_URL: ${EXECUTION_API_BASE_URL:-http://execution-api:8090}
      EXECUTION_DISPATCH_TIMEOUT_SECONDS: ${EXECUTION_DISPATCH_TIMEOUT_SECONDS:-5}
      ARTIFACT_SERVICE_BASE_URL: ${ARTIFACT_SERVICE_BASE_URL:-http://artifact-service:8091}
      ARTIFACT_SERVICE_TIMEOUT_SECONDS: ${ARTIFACT_SERVICE_TIMEOUT_SECONDS:-10}
      REPORT_SERVICE_BASE_URL: ${REPORT_SERVICE_BASE_URL:-http://report-service:8092}
      REPORT_SERVICE_TIMEOUT_SECONDS: ${REPORT_SERVICE_TIMEOUT_SECONDS:-30}
      WORKER_SCALER_BASE_URL: ${WORKER_SCALER_BASE_URL:-http://worker-scaler:8093}
      WORKER_SCALER_TIMEOUT_SECONDS: ${WORKER_SCALER_TIMEOUT_SECONDS:-15}
      WORKER_EXECUTION_MIN_REPLICAS: ${WORKER_EXECUTION_MIN_REPLICAS:-0}
      WORKER_EXECUTION_MAX_REPLICAS: ${WORKER_EXECUTION_MAX_REPLICAS:-200}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      execution-api:
        condition: service_healthy
      artifact-service:
        condition: service_healthy
      report-service:
        condition: service_healthy
      worker-scaler:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - harness

  worker-execution:
    build:
      context: ./execution-api
      dockerfile: Dockerfile.execution
    restart: unless-stopped
    # Parallelism = replica count. Each replica stays --concurrency=1 --max-tasks-per-child=1
    # (one isolated process + one fresh browser per iteration). -E emits task events for Flower.
    deploy:
      replicas: ${WORKER_EXECUTION_REPLICAS:-6}
      resources:
        limits:
          memory: ${WORKER_EXECUTION_MEMORY:-1g}
    labels:
      com.harness.role: worker-execution
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--queues=execution", "--pool=prefork", "--concurrency=1", "--max-tasks-per-child=1", "-E"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://harness:harness_dev_password@postgres:5432/harness?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      EXECUTION_QUEUE: ${EXECUTION_QUEUE:-execution}
      MAINTENANCE_QUEUE: ${MAINTENANCE_QUEUE:-maintenance}
      # WORKER_ID intentionally unset: derived per-replica from the container hostname
      # so every worker-execution replica gets a unique id (heartbeat/complete are
      # worker_id-scoped; a shared id would let a stale replica touch another's lease).
      LEASE_SECONDS: ${LEASE_SECONDS:-60}
      HEARTBEAT_SECONDS: ${HEARTBEAT_SECONDS:-5}
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-30}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-2}
      ARTIFACT_SERVICE_BASE_URL: ${ARTIFACT_SERVICE_BASE_URL:-http://artifact-service:8091}
      ARTIFACT_SERVICE_TIMEOUT_SECONDS: ${ARTIFACT_SERVICE_TIMEOUT_SECONDS:-10}
      CUA_MAX_STEPS: ${CUA_MAX_STEPS:-20}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      artifact-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from app.celery_app import celery_app; raise SystemExit(0 if celery_app else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - harness

  worker-maintenance:
    build:
      context: ./execution-api
    restart: unless-stopped
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--queues=maintenance", "--pool=prefork", "--concurrency=1", "--max-tasks-per-child=1"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://harness:harness_dev_password@postgres:5432/harness?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      EXECUTION_QUEUE: ${EXECUTION_QUEUE:-execution}
      MAINTENANCE_QUEUE: ${MAINTENANCE_QUEUE:-maintenance}
      WORKER_ID: worker-maintenance
      LEASE_SECONDS: ${LEASE_SECONDS:-60}
      HEARTBEAT_SECONDS: ${HEARTBEAT_SECONDS:-5}
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-30}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-2}
      ARTIFACT_SERVICE_BASE_URL: ${ARTIFACT_SERVICE_BASE_URL:-http://artifact-service:8091}
      ARTIFACT_SERVICE_TIMEOUT_SECONDS: ${ARTIFACT_SERVICE_TIMEOUT_SECONDS:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from app.celery_app import celery_app; raise SystemExit(0 if celery_app else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - harness

  worker-scheduler:
    build:
      context: ./execution-api
    restart: unless-stopped
    command: ["celery", "-A", "app.celery_app:celery_app", "beat", "--loglevel=INFO"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://harness:harness_dev_password@postgres:5432/harness?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      EXECUTION_QUEUE: ${EXECUTION_QUEUE:-execution}
      MAINTENANCE_QUEUE: ${MAINTENANCE_QUEUE:-maintenance}
      WORKER_ID: worker-scheduler
      LEASE_SECONDS: ${LEASE_SECONDS:-60}
      HEARTBEAT_SECONDS: ${HEARTBEAT_SECONDS:-5}
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-30}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-2}
      ARTIFACT_SERVICE_BASE_URL: ${ARTIFACT_SERVICE_BASE_URL:-http://artifact-service:8091}
      ARTIFACT_SERVICE_TIMEOUT_SECONDS: ${ARTIFACT_SERVICE_TIMEOUT_SECONDS:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker-maintenance:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from app.celery_app import celery_app; raise SystemExit(0 if celery_app and celery_app.conf.beat_schedule else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - harness

  # Least-privilege Docker API gateway: the raw socket is mounted ONLY here, and
  # only the container endpoints the scaler needs are allowed (everything else 403s).
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1        # allow /containers/* (list, inspect, create, start, stop, restart, remove)
      POST: 1              # allow write methods (POST/DELETE) on the allowed section
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      EXEC: 0
      SWARM: 0
      SYSTEM: 0
      INFO: 0
      AUTH: 0
      SERVICES: 0
      TASKS: 0
      SECRETS: 0
      CONFIGS: 0
      NODES: 0
      PLUGINS: 0
      BUILD: 0
      COMMIT: 0
      DISTRIBUTION: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - harness

  # Internal-only service that scales/starts/stops/restarts worker-execution
  # containers via the socket-proxy. Reached by the Go API (Phase 3); never public.
  worker-scaler:
    build:
      context: ./worker-scaler
    restart: unless-stopped
    environment:
      DOCKER_API_URL: ${DOCKER_API_URL:-http://docker-socket-proxy:2375}
      FLOWER_BASE_URL: ${FLOWER_BASE_URL:-http://flower:5555}
      FLOWER_URL_PREFIX: ${FLOWER_URL_PREFIX:-flower}
      WORKER_LABEL_KEY: com.harness.role
      WORKER_LABEL_VALUE: worker-execution
      MIN_REPLICAS: ${WORKER_EXECUTION_MIN_REPLICAS:-0}
      MAX_REPLICAS: ${WORKER_EXECUTION_MAX_REPLICAS:-200}
    depends_on:
      docker-socket-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8093/internal/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - harness

  # Live worker monitoring; the scaler uses its REST API for idle detection.
  flower:
    image: mher/flower:2.0.1
    restart: unless-stopped
    environment:
      # Flower 2.x requires this to serve its REST API without login. Safe here:
      # flower is internal-only (no published port); the worker-scaler is the only caller.
      FLOWER_UNAUTHENTICATED_API: "true"
    command: ["celery", "--broker=${CELERY_BROKER_URL:-redis://redis:6379/1}", "flower", "--port=5555", "--url-prefix=flower"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5555/flower/healthcheck')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - harness

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - harness

networks:
  harness:
    driver: bridge

volumes:
  postgres-data:
  redis-data:

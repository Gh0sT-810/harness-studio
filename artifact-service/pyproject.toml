[project]
name = "harness-artifact-service"
version = "0.1.0"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.124.0",
  "httpx>=0.28.0",
  "psycopg[binary]>=3.3.0",
  "pydantic-settings>=2.12.0",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.38.0",
]

[project.optional-dependencies]
test = [
  "pytest>=9.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

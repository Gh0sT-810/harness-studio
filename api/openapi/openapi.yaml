openapi: 3.1.0
info:
  title: Harness Studio API
  version: 0.2.0
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: API health with PostgreSQL and Redis readiness
      responses:
        "200":
          description: Healthy
  /api/auth/login:
    post:
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Access and refresh tokens
  /api/auth/refresh:
    post:
      summary: Rotate a refresh token
      responses:
        "200":
          description: New token pair
  /api/me:
    get:
      summary: Current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
  /api/gyms:
    get:
      summary: List gyms
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Gym list
    post:
      summary: Create gym
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created gym
  /api/tasks:
    get:
      summary: List tasks
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Task list
    post:
      summary: Create task
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created task
  /api/models:
    get:
      summary: List model definitions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Model definition list
  /api/model-providers:
    get:
      summary: List model providers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Model provider list
  /api/batches:
    get:
      summary: List batches
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Batch list
    post:
      summary: Create metadata-only batch with execution snapshots and pending iterations
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created batch
  /api/batches/{id}/snapshot:
    get:
      summary: Consolidated batch snapshot
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Batch, executions, iterations, counts, catalog metadata, and report placeholder
  /api/batches/{id}/events:
    get:
      summary: Stream batch events through Server-Sent Events
      description: >
        Streams Redis Stream-backed batch events. Clients should reconnect with Last-Event-ID
        and reload the snapshot if a gap or snapshot.required event is observed.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
        - name: last_event_id
          in: query
          required: false
          schema:
            type: string
        - name: access_token
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: SSE stream of BatchEventEnvelope payloads
          content:
            text/event-stream:
              schema:
                type: string
  /api/artifacts/{id}:
    get:
      summary: Download an artifact by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Artifact bytes proxied from artifact-service
  /api/artifacts/{id}/metadata:
    get:
      summary: Get artifact metadata by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Artifact metadata
  /api/iterations/{id}/files:
    get:
      summary: List files captured for an iteration
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Artifact metadata list
  /api/iterations/{id}/timeline:
    get:
      summary: Download the iteration action timeline document
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Timeline JSON document proxied from the iteration timeline artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineDocument"
        "404":
          description: No timeline artifact exists for this iteration
  /api/iterations/{id}/screenshot:
    get:
      summary: Download an iteration screenshot
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [before, after]
            default: after
      responses:
        "200":
          description: Screenshot bytes proxied from artifact-service
        "404":
          description: No screenshot artifact exists for this iteration
  /api/batches/{id}/archive:
    get:
      summary: Download a ZIP archive of artifacts created by iterations in the batch
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ZIP archive proxied from artifact-service
        "404":
          description: Batch artifacts were not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    Envelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        statusCode:
          type: integer
        data: {}
    TimelineStep:
      type: object
      properties:
        id:
          type: string
        index:
          type: integer
        type:
          type: string
        message:
          type: string
        url:
          type: string
        title:
          type: string
        beforeArtifactId:
          type: string
        afterArtifactId:
          type: string
    TimelineDocument:
      type: object
      properties:
        version:
          type: string
        iterationId:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/TimelineStep"
    BatchEventEnvelope:
      type: object
      required: [version, type, id, batch_id, occurred_at, payload]
      properties:
        version:
          type: string
          example: v1
        type:
          type: string
          enum:
            - batch.created
            - batch.summary_updated
            - user.action
            - snapshot.required
            - iteration.started
            - iteration.step_added
            - artifact.created
            - iteration.completed
            - execution.updated
            - report.ready
            - iteration.lease_expired
        id:
          type: string
        batch_id:
          type: string
          format: uuid
        execution_id:
          type: string
          format: uuid
        iteration_id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        sequence:
          type: string
          description: Redis Stream ID used as SSE id
        payload:
          type: object
          additionalProperties: true

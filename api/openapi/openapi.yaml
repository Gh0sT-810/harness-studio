openapi: 3.1.0
info:
  title: Harness Studio API
  version: 0.2.0
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: API health with PostgreSQL and Redis readiness
      responses:
        "200":
          description: Healthy
  /api/auth/login:
    post:
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Access and refresh tokens
  /api/auth/refresh:
    post:
      summary: Rotate a refresh token
      responses:
        "200":
          description: New token pair
  /api/me:
    get:
      summary: Current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
  /api/gyms:
    get:
      summary: List gyms
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Gym list
    post:
      summary: Create gym
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created gym
  /api/tasks:
    get:
      summary: List tasks
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Task list
    post:
      summary: Create task
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created task
  /api/models:
    get:
      summary: List model definitions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Model definition list
    post:
      summary: Create model definition
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelDefinitionRequest"
      responses:
        "201":
          description: Created model definition
  /api/models/{id}:
    put:
      summary: Update model definition
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelDefinitionRequest"
      responses:
        "200":
          description: Updated model definition
    delete:
      summary: Disable model definition
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Model disabled
  /api/models/{id}/default:
    post:
      summary: Set default model for its provider
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Default model updated
  /api/models/{id}/test:
    post:
      summary: Validate model registry configuration without external provider calls
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Model test result
  /api/model-providers:
    get:
      summary: List model providers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Model provider list
    post:
      summary: Create model provider
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelProviderRequest"
      responses:
        "201":
          description: Created model provider
  /api/model-providers/{id}:
    put:
      summary: Update model provider
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelProviderRequest"
      responses:
        "200":
          description: Updated model provider
  /api/model-providers/{id}/test:
    post:
      summary: Validate provider registry configuration without raw secret storage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Provider test result
  /api/admin/runtime-config:
    get:
      summary: Get core runtime config from catalog.system_config
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Runtime config
    put:
      summary: Update core runtime config
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Runtime config updated
  /api/admin/embedding-config:
    get:
      summary: Get embedding runtime config from catalog.system_config
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Embedding config
    put:
      summary: Update embedding runtime config
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Embedding config updated
  /api/batches:
    get:
      summary: List batches
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Batch list
    post:
      summary: Create metadata-only batch with execution snapshots and pending iterations
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created batch
  /api/batches/{id}/snapshot:
    get:
      summary: Consolidated batch snapshot
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Batch, executions, iterations, counts, catalog metadata, and report readiness
  /api/batches/{id}/events:
    get:
      summary: Stream batch events through Server-Sent Events
      description: >
        Streams Redis Stream-backed batch events. Clients should reconnect with Last-Event-ID
        and reload the snapshot if a gap or snapshot.required event is observed.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
        - name: last_event_id
          in: query
          required: false
          schema:
            type: string
        - name: access_token
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: SSE stream of BatchEventEnvelope payloads
          content:
            text/event-stream:
              schema:
                type: string
  /api/artifacts/{id}:
    get:
      summary: Download an artifact by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Artifact bytes proxied from artifact-service
  /api/artifacts/{id}/metadata:
    get:
      summary: Get artifact metadata by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Artifact metadata
  /api/iterations/{id}/files:
    get:
      summary: List files captured for an iteration
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Artifact metadata list
  /api/iterations/{id}/timeline:
    get:
      summary: Download the iteration action timeline document
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Timeline JSON document proxied from the iteration timeline artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineDocument"
        "404":
          description: No timeline artifact exists for this iteration
  /api/iterations/{id}/screenshot:
    get:
      summary: Download an iteration screenshot
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [before, after]
            default: after
      responses:
        "200":
          description: Screenshot bytes proxied from artifact-service
        "404":
          description: No screenshot artifact exists for this iteration
  /api/batches/{id}/archive:
    get:
      summary: Download a ZIP archive of artifacts created by iterations in the batch
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ZIP archive proxied from artifact-service
        "404":
          description: Batch artifacts were not found
  /api/reports:
    post:
      summary: Create a report job
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Report job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /api/reports/{id}:
    get:
      summary: Get report job status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Report job status
  /api/batches/{id}/report:
    post:
      summary: Create and run a batch report job
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Report generation requested
    get:
      summary: Get latest batch report job
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Latest batch report job
  /api/usage/summary:
    get:
      summary: Token usage summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Token usage summary by model and gym
  /api/usage/export/csv:
    get:
      summary: Export token usage CSV
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Token usage CSV
          content:
            text/csv:
              schema:
                type: string
  /api/usage/filters:
    get:
      summary: Token usage filter options
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Available usage filters
  /api/leaderboard:
    get:
      summary: Leaderboard aggregate metrics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Model and gym performance leaderboard
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    Envelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        statusCode:
          type: integer
        data: {}
    TimelineStep:
      type: object
      properties:
        id:
          type: string
        index:
          type: integer
        type:
          type: string
        message:
          type: string
        url:
          type: string
        title:
          type: string
        beforeArtifactId:
          type: string
        afterArtifactId:
          type: string
    TimelineDocument:
      type: object
      properties:
        version:
          type: string
        iterationId:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/TimelineStep"
    ReportJob:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        generatedArtifactId:
          type: string
    ModelProviderRequest:
      type: object
      required: [key, displayName, adapterKey]
      properties:
        key:
          type: string
        name:
          type: string
        displayName:
          type: string
        adapterKey:
          type: string
          enum: [openai_responses_computer, anthropic_computer_use, gemini_computer_use, text_only, llm_grader, embedding]
        baseUrl:
          type: string
        secretRef:
          type: string
          description: Environment/secret manager reference. Raw API keys must not be stored.
        enabled:
          type: boolean
        config:
          type: object
          additionalProperties: true
    ModelDefinitionRequest:
      type: object
      required: [providerId, modelName, displayName]
      properties:
        providerId:
          type: string
        modelName:
          type: string
        displayName:
          type: string
        capabilities:
          type: object
          additionalProperties: true
        config:
          type: object
          additionalProperties: true
        costConfig:
          type: object
          additionalProperties: true
        timeoutSeconds:
          type: integer
        maxOutputTokens:
          type: integer
        enabled:
          type: boolean
        isDefault:
          type: boolean
    SystemConfig:
      type: object
      properties:
        key:
          type: string
        value:
          type: object
          additionalProperties: true
        updatedAt:
          type: string
    TokenUsageSummary:
      type: object
      properties:
        inputTokens:
          type: integer
        outputTokens:
          type: integer
        totalTokens:
          type: integer
        totalCostUsd:
          type: number
    LeaderboardRow:
      type: object
      properties:
        modelId:
          type: string
        gymId:
          type: string
        passRate:
          type: number
        totalTokens:
          type: integer
    BatchEventEnvelope:
      type: object
      required: [version, type, id, batch_id, occurred_at, payload]
      properties:
        version:
          type: string
          example: v1
        type:
          type: string
          enum:
            - batch.created
            - batch.summary_updated
            - user.action
            - snapshot.required
            - iteration.started
            - iteration.step_added
            - artifact.created
            - iteration.completed
            - execution.updated
            - report.ready
            - iteration.lease_expired
        id:
          type: string
        batch_id:
          type: string
          format: uuid
        execution_id:
          type: string
          format: uuid
        iteration_id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        sequence:
          type: string
          description: Redis Stream ID used as SSE id
        payload:
          type: object
          additionalProperties: true

[project]
name = "harness-execution-api"
version = "0.1.0"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "celery>=5.6.0",
  "fastapi>=0.124.0",
  "httpx>=0.28.0",
  "anthropic>=0.40.0",
  "google-genai>=1.0.0",
  "openai>=1.102.0",
  "psycopg[binary]>=3.3.0",
  "pydantic-settings>=2.12.0",
  "playwright>=1.60.0",
  "redis>=7.1.0",
  "uvicorn[standard]>=0.38.0",
]

[project.optional-dependencies]
test = [
  "pytest>=9.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
